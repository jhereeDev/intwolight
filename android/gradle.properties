org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation corrupts its own caches on Windows when a
# Gradle build is killed mid-write — ':shared_preferences_android:
# compileReleaseKotlin' then fails with "Could not close incremental caches"
# on every subsequent build, and deleting the cache directory does not clear
# it because a stale Kotlin daemon still holds the file locks.
# The only Kotlin in this project is plugin glue and a 5-line MainActivity, so
# incremental buys nothing measurable. Turned off 2026-08-03 after it cost a
# build cycle.
kotlin.incremental=false
